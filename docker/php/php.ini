; PHP production settings — LanBase
expose_php = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Remote file access — disabled to prevent SSRF and RFI attacks
allow_url_fopen = Off
allow_url_include = Off

; Limits (apps may override via their own drop-in in /usr/local/etc/php/conf.d/)
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20

; Session
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.use_only_cookies = 1

; Date
date.timezone = UTC
